name: setup validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: portable setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate setup
        run: python3 scripts/check_setup.py
      - name: Exercise adapter boundaries without providers
        run: python3 scripts/test_adapters.py
