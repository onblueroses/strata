version: 2

updates:
  # The workflow pins each action to a commit SHA, which no upstream tag move can
  # repoint. A pinned SHA also goes stale in silence, so Dependabot is the half that
  # makes the pin maintainable: it rewrites the SHA and the trailing version comment
  # together. One group, so a week of action releases arrives as one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
# No pip entry: the Python tool versions are pinned inline in ci.yml rather than in a
# requirements file, and Dependabot reads files, not workflow arguments. Bump them in
# the workflow.
